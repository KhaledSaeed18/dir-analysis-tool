version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      # Runtime dependency updates ship to users as a patch release; tooling updates do not release.
      prefix: fix
      prefix-development: build
      include: scope
    ignore:
      # Types track the oldest supported Node.js (engines), so code cannot use newer APIs by accident.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # v10 needs conventional-changelog-writer 9, which semantic-release's notes generator does not use yet.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
    groups:
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
