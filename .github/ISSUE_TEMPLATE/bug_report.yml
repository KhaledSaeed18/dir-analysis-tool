name: Bug report
description: dat crashed, hung, printed an error it shouldn't, or wrote something wrong.
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for crashes, errors and broken behavior. If a number or a list in a report is wrong (a size, a duplicate, a skipped path), use the **Wrong result** form instead. For security issues, follow the [security policy](https://github.com/KhaledSaeed18/dir-analysis-tool/security/policy) and don't open an issue.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What dat did, including any error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: The exact command, or the library call, so it can be run again. Include the config file if one was used.
      placeholder: npx dir-analysis-tool@latest ~/photos -d --html report.html
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Directory layout
      description: The smallest directory layout that shows the problem, for example the output of `find . | head -n 20`. Rename anything private.
      render: text

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Everything dat printed, on stdout and stderr, and its exit code (`echo $?`). For unexpected errors, run it again with `DAT_DEBUG=1` to include a stack trace.
      render: text

  - type: input
    id: version
    attributes:
      label: dir-analysis-tool version
      description: Output of `dat --version`.
      placeholder: 3.4.1
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options:
        - A local terminal
        - CI (GitHub Actions, GitLab CI or another)
        - A container
        - As a library, from code
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: The file system (APFS, ext4, NTFS, a network drive), the terminal, or anything that seems related.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this with the latest dir-analysis-tool release.
          required: true
        - label: I searched existing issues.
          required: true
