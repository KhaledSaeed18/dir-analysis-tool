name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Please check that it still happens with the latest version (`npx dir-analysis-tool@latest`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran `dat ~/photos -d` and expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or a small directory layout that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output. For unexpected errors, run with `DAT_DEBUG=1` to include a stack trace.
      render: text
  - type: input
    id: version
    attributes:
      label: dir-analysis-tool version
      description: Output of `dat --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
