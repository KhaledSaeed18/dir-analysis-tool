name: Accessibility barrier
description: Something in dir-analysis-tool, its reports or its documentation is hard or impossible to use with the way you work.
title: '[a11y] '
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. [ACCESSIBILITY.md](https://github.com/KhaledSaeed18/dir-analysis-tool/blob/main/ACCESSIBILITY.md) describes what dir-analysis-tool aims for and its known limitations. Share only what you're comfortable sharing; if you'd rather report privately, email the address in that file.

  - type: textarea
    id: barrier
    attributes:
      label: The barrier
      description: What you were trying to do, and what got in the way.
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: What you use
      description: For example a screen reader or braille display and its version, a magnifier, a terminal emulator, a browser, a color scheme, or a keyboard-only setup.

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The dat command, if the barrier is in its output or in a report.
      render: shell

  - type: textarea
    id: better
    attributes:
      label: What would work better
      description: Optional. How the output, the reports or the documentation could work for you.
