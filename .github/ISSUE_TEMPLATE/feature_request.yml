name: Feature request
description: Suggest a new report, option, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the question you want the tool to answer, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A command or output sketch helps a lot.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
