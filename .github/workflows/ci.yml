name: CI

# Pull requests run this directly; pushes to main run it through the release workflow.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (lint, types, format, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: schema.json is up to date
        run: pnpm schema && git diff --exit-code schema.json
      - run: pnpm build
      - run: pnpm check:package
      - name: Smoke test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js . --json | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8')); console.log('JSON output is valid')"
          node dist/cli.js . -d -x -t --empty --stale 1y --no-color
          node dist/cli.js compare src dist --no-color > /dev/null
          node dist/cli.js . -b "size<=1GB" -b "errors=0" -q

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm test:coverage
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: pnpm test
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
